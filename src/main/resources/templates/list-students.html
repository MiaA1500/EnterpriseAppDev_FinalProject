<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Student Directory</title>
</head>
<body>
    <div class="container">
        <h4>School of IT Student Directory</h4>
        <hr>

        <!-- Add a button -->
        <a th:href="@{/student/add}"
           class="btn btn-primary btn-sm mb-3">
            Add Student
        </a>

        <table class="table table-bordered">
            <thead>
                <tr class="bg-danger">
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Major</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="theStudent:${students}">
                    <td th:text="${theStudent.firstName}"/>
                    <td th:text="${theStudent.lastName}"/>
                    <td th:text="${theStudent.major}"/>
                    <td>
                        <a th:href="@{/student/edit(studentId=${theStudent.id})}"
                           class="btn btn-info btn-sm">
                            Update
                        </a>
                        <a th:href="@{/student/delete(studentId=${theStudent.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="if (!(confirm('Are you sure you want to delete this student?'))) return false">
                            Delete
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
