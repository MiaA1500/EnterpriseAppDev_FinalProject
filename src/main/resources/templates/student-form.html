<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Student Directory</title>
</head>
<body>
    <div class="container">
        <h4>School of IT Student Directory</h4>
        <hr>

        <p class="h4 mb-4" th:text="${student.id != 0} ? 'Update Student' : 'Add Student'">Add Student</p>

        <form action="#" th:action="@{/student/save}"
              th:object="${student}"
              method="POST">

            <!-- Add hidden form field to handle update -->
            <input type="hidden" th:field="*{id}" />

            <input type="text" th:field="*{firstName}"
                   class="form-control mb-4 col-4" placeholder="First Name">

            <input type="text" th:field="*{lastName}"
                   class="form-control mb-4 col-4" placeholder="Last Name">

            <input type="text" th:field="*{major}"
                   class="form-control mb-4 col-4" placeholder="Major">

            <button type="submit" class="btn btn-info col-2"
                    th:text="${student.id != 0} ? 'Update' : 'Save'">Save</button>

        </form>

        <hr>
        <a th:href="@{/student/view}">Back to Student List</a>
    </div>
</body>
</html>
